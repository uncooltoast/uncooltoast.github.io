<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Uncool Toast" />
  <meta name="description" content="Uncool Toast's What even is time???? A meditation / bell timer app." />
  <meta property="og:description" content="Uncool Toast's What even is time???? A meditation / bell timer app." />
  <meta property="og:image" content="https://uncooltoast.github.io/favicon.png" />
  <meta property="og:title" content="Uncool Toast" />
  <title>Uncool Toast's What even is time????</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --base-color: hsl(24, 100%, 50%);
      --accent: hsl(from var(--base-color) calc(h + 10) s calc(l + 14));
      --accent-alt: hsl(from var(--base-color) calc(h + 20) calc(s - 8) calc(l + 5));
      --foreground: hsl(from var(--base-color) h calc(s - 25) calc(l - 20));
      --contrast: hsl(from var(--base-color) calc(h + 20) s calc(l + 40));
      --contrast-alt: hsl(from var(--contrast) calc(h - 3) calc(s - 10) calc(l - 15));
      --shadow:
        1rem -1rem 2rem var(--contrast-alt),
        -1rem 1rem 2rem var(--contrast-alt),
        1rem 1rem 2rem var(--contrast),
        -1rem -1rem 2rem var(--contrast);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: auto;
    }
    
    body {
      font-family: sans-serif;
      background-color: var(--base-color);
      background-color: var(--accent);
      background-image: linear-gradient(319deg, var(--accent) 0%, var(--base-color) 37%, var(--accent-alt) 100%);
      color: var(--foreground);
    }

    h1, p {
      text-shadow: var(--shadow);
    }

    h1 {
      font-size: 3rem;
      line-height: 4rem;
    }

    p {
      font-size: 1.5rem;
      line-height: 2.5rem;
    }

    .content {
      position: fixed;
      top: 0%;
      left: 0%;
      width: 100%;
      height: 100%;
      display: flex;
      flex-flow: column nowrap;
      justify-content: flex-start;
      align-items: center;
      gap: 3rem;
      text-align: center;
      padding: 3rem 1rem 1rem;
      box-sizing: border-box;
      overflow-y: auto;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 2rem;
        line-height: 3rem;
      }

      p {
        font-size: 1.2rem;
        line-height: 1.8rem;
      }
    }
  </style>
</head>

<body>
  <main class="content">
    <h1>So long and thanks for all the ringing</h1>
    <section>
      <p>This page has moved to <a href="https://sojeri.github.io/bells">https://sojeri.github.io/bells</a></p>
    </section>
  </main>
</body>
</html>
